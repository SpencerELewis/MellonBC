name: Deploy BaliNook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: BaliNook/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: BaliNook

      - name: Build
        working-directory: BaliNook
        env:
          # Optional override (for custom domains or advanced setups).
          # If empty, the workflow auto-derives the correct base path.
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
        run: |
          if [ -z "$VITE_BASE_PATH" ]; then
            REPO_NAME="${{ github.event.repository.name }}"
            if [[ "$REPO_NAME" == *.github.io ]]; then
              VITE_BASE_PATH="/"
            else
              VITE_BASE_PATH="/$REPO_NAME/"
            fi
          fi

          echo "Using VITE_BASE_PATH=$VITE_BASE_PATH"
          VITE_BASE_PATH="$VITE_BASE_PATH" npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: BaliNook/build/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
