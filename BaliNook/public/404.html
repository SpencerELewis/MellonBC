<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>BaliNook Book Club</title>
    <script>
      // Single-page app redirect for GitHub Pages
      // Encodes the full path as a query string so index.html can restore it.
      // Set segmentsToKeep to the number of path segments in your repo subdirectory.
      // e.g. if deployed to username.github.io/MellonBC/ use segmentsToKeep = 1
      var segmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
